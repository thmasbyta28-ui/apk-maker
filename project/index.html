<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>پیکس‌انیم</title>
<style>
:root{--bg:#14141c;--panel:#1e1e2a;--panel2:#2a2a3a;--line:#38384c;--txt:#e9e9f2;--mut:#9a9ab0;--acc:#7c6cff;--ok:#38d9a9;--danger:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--danger)}
input,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
input[type=range]{padding:0;height:28px;accent-color:var(--acc)}
input[type=checkbox]{width:auto}
#top{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
#top button{width:40px;height:38px;padding:0;font-size:17px;flex:0 0 auto}
#nameBtn{flex:1;min-width:0;width:auto!important;text-align:start;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#nameBtn small{display:block;font-size:10px;color:var(--mut)}
#vp{flex:1;position:relative;overflow:hidden;background:#0c0c12;touch-action:none;min-height:80px}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background-color:#d8d8d8;background-image:conic-gradient(#b5b5b5 25%,transparent 0 50%,#b5b5b5 0 75%,transparent 0);background-size:4px 4px;box-shadow:0 0 0 1px #000}
#stage canvas,#stage img{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#refImg{object-fit:contain;image-rendering:auto!important;z-index:1}
#onP{z-index:2;filter:sepia(1) saturate(6) hue-rotate(-50deg);opacity:.4}
#onN{z-index:3;filter:sepia(1) saturate(6) hue-rotate(80deg);opacity:.35}
#cv{z-index:4}
#grid{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
#tools{display:flex;gap:4px;overflow-x:auto;padding:5px;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
.tb{flex:0 0 auto;width:54px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;padding:2px;line-height:1.2}
.tb i{font-style:normal;font-size:18px}
.sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
#palRow{display:flex;gap:6px;align-items:center;padding:5px;background:var(--panel);border-top:1px solid var(--line)}
#curCol{flex:0 0 44px;height:40px;border-radius:10px;border:2px solid #fff;padding:0}
#pal{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.sw{flex:0 0 26px;height:30px;border-radius:6px;border:2px solid transparent;outline:1px solid #0006}
.sw.sel{border-color:#fff}
#tl{background:var(--panel);border-top:1px solid var(--line)}
#tlCtl{display:flex;gap:5px;overflow-x:auto;padding:5px;align-items:center;scrollbar-width:none}
#tlCtl button{flex:0 0 auto;height:34px;padding:0 10px;font-size:13px;white-space:nowrap}
.grp{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:12px;color:var(--mut)}
.grp b{color:var(--txt);min-width:22px;text-align:center}
#strip{display:flex;gap:6px;overflow-x:auto;padding:4px 6px 8px;position:relative}
.fr{flex:0 0 auto;min-width:58px;border:2px solid var(--line);border-radius:8px;background:var(--panel2);padding:3px;text-align:center;font-size:11px;color:var(--mut)}
.fr.sel{border-color:var(--acc);color:#fff}
.fr canvas{display:block;margin:0 auto 2px;image-rendering:pixelated;background-color:#d8d8d8;background-image:conic-gradient(#b5b5b5 25%,transparent 0 50%,#b5b5b5 0 75%,transparent 0);background-size:6px 6px;border-radius:3px}
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:560px;max-height:88dvh;background:var(--panel);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.sh button{width:34px;height:34px;padding:0}
.sb{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.lab{font-size:12px;color:var(--mut);margin-bottom:-4px}
.card{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px}
.card img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;background:#222;border-radius:6px}
.card .t{flex:1;min-width:0}
.card .t div:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .t small{color:var(--mut)}
.card button{flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.hint{font-size:12px;color:var(--mut);line-height:1.7}
.prog{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.prog div{height:100%;width:0;background:var(--ok)}
.lrow{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px}
.lrow.sel{border-color:var(--acc)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:6px}
.lrow button{width:34px;height:34px;padding:0;flex:0 0 auto}
#svc{width:100%;height:170px;border-radius:10px;touch-action:none;display:block}
#hue{background:linear-gradient(90deg,red,#ff0,#0f0,#0ff,#00f,#f0f,red)}
</style>
</head>
<body>
<div id="app">
  <div id="top" dir="ltr">
    <button id="bMenu" title="پروژه‌ها">☰</button>
    <button id="nameBtn"><span id="nameTxt">—</span><small id="saveInd"></small></button>
    <button id="bUndo" title="برگردان">↶</button>
    <button id="bRedo" title="جلو">↷</button>
    <button id="bFit" title="جا دادن">⛶</button>
    <button id="bExport" title="خروجی">⬇</button>
  </div>
  <div id="vp">
    <div id="stage">
      <img id="refImg" alt="">
      <canvas id="onP"></canvas>
      <canvas id="onN"></canvas>
      <canvas id="cv"></canvas>
    </div>
    <canvas id="grid"></canvas>
  </div>
  <div id="tools" dir="ltr"></div>
  <div id="palRow" dir="ltr"><button id="curCol"></button><div id="pal"></div><button id="bAddCol" style="flex:0 0 40px;height:36px;padding:0">＋</button></div>
  <div id="tl" dir="ltr">
    <div id="tlCtl"></div>
    <div id="strip"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileRef" accept="image/*" hidden>
<input type="file" id="fileProj" accept=".pixanim,.json,application/json,application/octet-stream,*/*" hidden>

<script>
'use strict';
// ==LIB==
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);
    ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+size;
  }
  let csize=0;for(const c of central)csize+=c.length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}
function lzwEncode(px,minCode){
  const clear=1<<minCode,eoi=clear+1;
  let codeSize=minCode+1,next=eoi+1;
  const dict=new Map();
  let out=new Uint8Array(Math.ceil(px.length*1.6)+1024),op=0,cur=0,bits=0;
  function emit(c){cur|=c<<bits;bits+=codeSize;while(bits>=8){out[op++]=cur&255;cur>>>=8;bits-=8}}
  emit(clear);
  let prefix=px[0];
  for(let i=1;i<px.length;i++){
    const k=px[i],key=prefix*256+k,v=dict.get(key);
    if(v!==undefined){prefix=v;continue}
    emit(prefix);
    if(next>=(1<<codeSize)&&codeSize<12)codeSize++;
    if(next<4096){dict.set(key,next++)}
    else{emit(clear);dict.clear();codeSize=minCode+1;next=eoi+1}
    prefix=k;
  }
  emit(prefix);emit(eoi);if(bits>0)out[op++]=cur&255;
  return out.subarray(0,op);
}
class GifWriter{
  constructor(w,h,palette,trans){
    this.w=w;this.h=h;this.trans=trans;this.parts=[];
    this.parts.push(Uint8Array.from([71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,0xF7,0,0]));
    const g=new Uint8Array(768);palette.forEach((c,i)=>{if(i<256){g[i*3]=c[0];g[i*3+1]=c[1];g[i*3+2]=c[2]}});
    this.parts.push(g);
    this.parts.push(Uint8Array.from([0x21,0xFF,11,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0]));
  }
  add(px,delay){
    const t=this.trans>=0?1:0,d=Math.max(2,delay|0);
    this.parts.push(Uint8Array.from([0x21,0xF9,4,(2<<2)|t,d&255,d>>8,t?this.trans:0,0]));
    this.parts.push(Uint8Array.from([0x2C,0,0,0,0,this.w&255,this.w>>8,this.h&255,this.h>>8,0,8]));
    const data=lzwEncode(px,8);
    const nb=Math.ceil(data.length/255),blk=new Uint8Array(data.length+nb+1);let p=0;
    for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);blk[p++]=n;blk.set(data.subarray(i,i+n),p);p+=n}
    blk[p++]=0;this.parts.push(blk.subarray(0,p));
  }
  finish(){this.parts.push(Uint8Array.from([0x3B]));return new Blob(this.parts,{type:'image/gif'})}
}
function buildPalette(counts,hasT){
  const cols=[...counts.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const pal=cols.slice(0,hasT?255:256),map=new Map();
  pal.forEach((v,i)=>map.set(v,i));
  const rgb=pal.map(v=>[v&255,(v>>8)&255,(v>>16)&255]);
  const trans=hasT?pal.length:-1;if(hasT)rgb.push([0,0,0]);
  const idxOf=v=>{
    let m=map.get(v);if(m!==undefined)return m;
    const r=v&255,g=(v>>8)&255,b=(v>>16)&255;let best=0,bd=1e12;
    for(let i=0;i<pal.length;i++){const p=pal[i],dr=(p&255)-r,dg=((p>>8)&255)-g,db=((p>>16)&255)-b,d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=i}}
    map.set(v,best);return best;
  };
  return{palette:rgb,trans,idxOf};
}
function scaleIdx(src,w,h,s){
  if(s===1)return src;const W=w*s,o=new Uint8Array(W*h*s);
  for(let y=0;y<h;y++){const row=y*s*W;for(let x=0;x<w;x++){const v=src[y*w+x];for(let k=0;k<s;k++)o[row+x*s+k]=v}for(let k=1;k<s;k++)o.copyWithin(row+k*W,row,row+W)}
  return o;
}
// ==/LIB==

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='textContent')e[k]=v;
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}
  for(const kid of kids.flat())if(kid!=null&&kid!==false)e.append(kid.nodeType?kid:document.createTextNode(kid));
  return e;
}
let toastT;
function toast(msg,ms=1800){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function sheet(title,build,opts={}){
  const back=h('div',{class:'back'}),box=h('div',{class:'sheet'});
  const close=()=>{back.remove();opts.onclose&&opts.onclose()};
  box.append(h('div',{class:'sh'},h('b',null,title),h('button',{onclick:close},'✕')));
  const body=h('div',{class:'sb'});box.append(body);
  back.append(box);back.addEventListener('pointerdown',e=>{if(e.target===back)close()});
  document.body.append(back);build(body,close);return close;
}
function askText(title,val){return new Promise(res=>{let d=false;const fin=v=>{if(!d){d=true;res(v)}};
  sheet(title,(b,cl)=>{const inp=h('input',{type:'text',value:val||''});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){fin(inp.value.trim());cl()}});
    b.append(inp,h('div',{class:'row'},h('button',{class:'on',onclick:()=>{fin(inp.value.trim());cl()}},'تأیید'),h('button',{onclick:()=>{fin(null);cl()}},'لغو')));
    setTimeout(()=>inp.focus(),60)},{onclose:()=>fin(null)})})}
function askConfirm(msg,okText='بله'){return new Promise(res=>{let d=false;const fin=v=>{if(!d){d=true;res(v)}};
  sheet('مطمئنی؟',(b,cl)=>{b.append(h('div',null,msg),h('div',{class:'row'},h('button',{class:'danger',onclick:()=>{fin(true);cl()}},okText),h('button',{onclick:()=>{fin(false);cl()}},'لغو')))},{onclose:()=>fin(false)})})}

/* ---------- colors ---------- */
const h2p=hex=>{const n=parseInt(hex,16);return((255<<24)|((n&255)<<16)|(n&0xff00)|((n>>16)&255))>>>0};
const p2h=p=>[p&255,(p>>8)&255,(p>>16)&255].map(v=>v.toString(16).padStart(2,'0')).join('');
const DEFAULT_PALETTE=['000000','222034','45283c','663931','8f563b','df7126','d9a066','eec39a','fbf236','99e550','6abe30','37946e','4b692f','524b24','323c39','3f3f74','306082','5b6ee1','639bff','5fcde4','cbdbfc','ffffff','9badb7','847e87','696a6a','595652','76428a','ac3232','d95763','d77bba','8f974a','8a6f30'].map(h2p);
function hsv2rgb(hh,s,v){const f=(n,k=(n+hh/60)%6)=>v-v*s*Math.max(0,Math.min(k,4-k,1));return[f(5),f(3),f(1)].map(x=>Math.round(x*255))}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360}return[hh,mx?d/mx:0,mx]}

/* ---------- state ---------- */
let P=null;               // project
let curFrame=0,curLayer=0,tool='pencil',prevTool='pencil',color=h2p('000000'),brush=1,mirror=false,showGrid=false,onion=true,playing=false;
const V={z:4,tx:0,ty:0};
const dirty={frames:new Set(),meta:false,ref:false};
let stored=new Set(),saveTimer=null;
const hist=[];let histPos=0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const vp=$('#vp'),stage=$('#stage'),refImg=$('#refImg'),onP=$('#onP'),onN=$('#onN'),cv=$('#cv'),gridCv=$('#grid'),strip=$('#strip');
const ctx=cv.getContext('2d');
let mainBuf,mainImg;

function newProject(name,w,h){
  return{id:'p'+uid(),name,w,h,fps:12,layers:[{name:'لایه ۱',visible:true}],
    frames:[newFrame(w,h,1)],palette:DEFAULT_PALETTE.slice(),ref:null,updated:Date.now()};
}
function newFrame(w,h,layers){return{id:'f'+uid(),hold:1,cells:Array.from({length:layers},()=>new Uint32Array(w*h))}}

/* ---------- rendering ---------- */
function composite(fi,out){
  const n=P.w*P.h,f=P.frames[fi];out=out||new Uint32Array(n);out.fill(0);
  for(let l=0;l<P.layers.length;l++){if(!P.layers[l].visible)continue;const c=f.cells[l];for(let i=0;i<n;i++){const v=c[i];if(v)out[i]=v}}
  return out;
}
let renderQ=false;
function requestRender(){if(renderQ)return;renderQ=true;requestAnimationFrame(()=>{renderQ=false;renderMain()})}
function renderMain(){composite(curFrame,mainBuf);ctx.putImageData(mainImg,0,0)}
function renderOnion(){
  const show=onion&&!playing;
  for(const[c,off]of[[onP,-1],[onN,1]]){
    const i=curFrame+off;
    if(!show||i<0||i>=P.frames.length){c.style.display='none';continue}
    c.style.display='block';const b=composite(i);
    c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(b.buffer),P.w,P.h),0,0);
  }
}
function applyView(){stage.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.z})`;drawGrid()}
function fitView(){
  const vw=vp.clientWidth,vh=vp.clientHeight,m=Math.min(vw/P.w,vh/P.h)*0.94;
  V.z=m>=1?Math.floor(m):m;V.tx=(vw-P.w*V.z)/2;V.ty=(vh-P.h*V.z)/2;applyView();
}
function drawGrid(){
  const w=vp.clientWidth,hh=vp.clientHeight;
  if(gridCv.width!==w||gridCv.height!==hh){gridCv.width=w;gridCv.height=hh}
  const g=gridCv.getContext('2d');g.clearRect(0,0,w,hh);
  if(!showGrid||!P||V.z<6)return;
  g.strokeStyle='rgba(120,120,120,.55)';g.lineWidth=1;g.beginPath();
  const y0=Math.max(0,V.ty),y1=Math.min(hh,V.ty+P.h*V.z),x0=Math.max(0,V.tx),x1=Math.min(w,V.tx+P.w*V.z);
  for(let x=0;x<=P.w;x++){const sx=Math.round(V.tx+x*V.z)+.5;if(sx<0||sx>w)continue;g.moveTo(sx,y0);g.lineTo(sx,y1)}
  for(let y=0;y<=P.h;y++){const sy=Math.round(V.ty+y*V.z)+.5;if(sy<0||sy>hh)continue;g.moveTo(x0,sy);g.lineTo(x1,sy)}
  g.stroke();
}
function applyRef(){
  const r=P.ref;
  if(!r||!r.visible){refImg.style.display='none';return}
  refImg.style.display='block';refImg.src=r.src;refImg.style.opacity=r.opacity;
  refImg.style.transform=`translate(${r.ox}px,${r.oy}px) scale(${r.scale})`;refImg.style.transformOrigin='50% 50%';
  refImg.style.zIndex=r.above?5:1;
}

/* ---------- history & saving ---------- */

/* ---------- drawing ---------- */
let cell=null,col=0,before=null,drawing=false,sx=0,sy=0,lx=0,ly=0;
const inb=(x,y)=>x>=0&&y>=0&&x<P.w&&y<P.h;
function put(x,y){if(inb(x,y))cell[y*P.w+x]=col}
function putM(x,y){put(x,y);if(mirror)put(P.w-1-x,y)}
function stamp(x,y){const o=brush>>1;for(let j=0;j<brush;j++)for(let i=0;i<brush;i++)putM(x-o+i,y-o+j)}
function line(x0,y0,x1,y1,f){
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),stx=x0<x1?1:-1,sty=y0<y1?1:-1;let e=dx+dy;
  for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=stx}if(e2<=dx){e+=dx;y0+=sty}}
}
function rectShape(x0,y0,x1,y1,fill){
  const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1);
  if(fill){for(let y=b;y<=d;y++)for(let x=a;x<=c;x++)putM(x,y)}
  else{line(a,b,c,b,stamp);line(a,d,c,d,stamp);line(a,b,a,d,stamp);line(c,b,c,d,stamp)}
}
function ellipseShape(x0,y0,x1,y1,fill){
  const a0=Math.min(x0,x1),b0=Math.min(y0,y1),c0=Math.max(x0,x1),d0=Math.max(y0,y1);
  const cx=(a0+c0)/2,cy=(b0+d0)/2,a=(c0-a0)/2+.5,b=(d0-b0)/2+.5;
  for(let y=b0;y<=d0;y++)for(let x=a0;x<=c0;x++){
    const dx=(x-cx)/a,dy=(y-cy)/b;if(dx*dx+dy*dy>1)continue;
    if(fill){putM(x,y);continue}

function flood(x,y,c){
  if(!inb(x,y))return;const W=P.w,t=cell[y*W+x];if(t===c)return;
  const st=[x+y*W];
  while(st.length){const p=st.pop();if(cell[p]!==t)continue;const px=p%W;let l=p,r=p;
    while(px-(p-l)>0&&cell[l-1]===t)l--;while(px+(r-p)<W-1&&cell[r+1]===t)r++;
    for(let i=l;i<=r;i++){cell[i]=c;if(i>=W&&cell[i-W]===t)st.push(i-W);if(i<W*(P.h-1)&&cell[i+W]===t)st.push(i+W)}}

function pxPos(e){const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*P.w),Math.floor((e.clientY-r.top)/r.height*P.h)]}

const SHAPES=['line','rect','rectfill','circle','circlefill'];
function strokeStart(e){

  const[x,y]=pxPos(e);

  cell=P.frames[curFrame].cells[curLayer];before=cell.slice();col=tool==='eraser'?0:color;sx=lx=x;sy=ly=y;

      let g=x.createLinearGradient(0,0,256,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,256,170);
      g=x.createLinearGradient(0,0,0,170);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,256,170);

async function expGif(s,bg,setP,stopped){
  const n=P.frames.length,counts=new Map();let hasT=false;

    for(let k=0;k<c.length;k++){let v=c[k];if(!v){if(bg)v=bg;else{hasT=true;continue}}counts.set(v,(counts.get(v)||0)+1)}
    if(i%20===0){setP('بررسی رنگ‌ها…',i/n*.3);await sleep(0);if(stopped())throw'cancel'}
  }
  const q=buildPalette(counts,hasT),W=P.w*s,H=P.h*s,g=new GifWriter(W,H,q.palette,q.trans);

}
async function expVideo(s,bg,setP,stopped){
  if(!window.MediaRecorder)throw new Error('این مرورگر ضبط ویدیو رو پشتیبانی نمی‌کنه؛ از GIF یا ZIP استفاده کن');
  const sc=Math.max(s,Math.ceil(480/Math.max(P.w,P.h))),cw=P.w*sc+(P.w*sc%2),ch=P.h*sc+(P.h*sc%2);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const bgc='#'+p2h(bg||0xff000000);
  const draw=i=>{x.fillStyle=bgc;x.fillRect(0,0,cw,ch);x.drawImage(frameCanvas(i,1,0),0,0,P.w*sc,P.h*sc)};
  draw(0);
  const stream=c.captureStream(P.fps),types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw new Error('قالب ویدیویی پشتیبانی‌شده‌ای پیدا نشد');
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start(500);
  let t=performance.now(),total=P.frames.reduce((a,f)=>a+f.hold,0)/P.fps,el=0;
  try{
    for(let i=0;i<P.frames.length;i++){
      draw(i);const d=P.frames[i].hold*1000/P.fps;t+=d;
      while(performance.now()<t){await sleep(Math.min(40,Math.max(1,t-performance.now())));if(stopped())throw'cancel'}
      el+=d/1000;setP(`ضبط ویدیو… ${el.toFixed(1)} از ${total.toFixed(1)} ثانیه`,el/total);
    }
    await sleep(200);
  }finally{if(rec.state!=='inactive')rec.stop()}
  await done;stream.getTracks().forEach(tr=>tr.stop());
  const type=mime.split(';')[0];return{blob:new Blob(chunks,{type}),name:P.name+(type==='video/mp4'?'.mp4':'.webm')};
}

/* ---------- startup ---------- */
async function startup(forceMenu){
  buildTools();
  let ok=false;
  try{
    const last=localStorage.getItem('pixanim.last');
    if(last&&!forceMenu)ok=await loadProject(last);
    if(!ok){
      const metas=await dbMetaAll();
      if(metas.length&&!forceMenu)ok=await loadProject(metas.sort((a,b)=>b.updated-a.updated)[0].id);
    }
  }catch(e){setSave('⚠ ذخیره‌سازی در دسترس نیست')}
  if(!ok){
    P=newProject('انیمیشن اول',64,64);stored=new Set();resetUI();markAllDirty();
    toast('با دو انگشت زوم کن و جابه‌جا شو',3200);
  }
  buildTools();
}
buildTlCtl();

window.addEventListener('pagehide',()=>{saveNow()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
startup();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}

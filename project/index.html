<title>ربات پرنده</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
  /* Layout: header with gem counter, then either a menu panel (menu, levels, shop, result) or the game stage with touch pad. */
  :root {
    --bg: #e8ecf2; --fg: #1b2330; --muted: #5b6678; --panel: #f6f8fb; --line: #c9d1dd;
    --accent: #2f6bff; --accent-fg: #ffffff; --gem: #0a8fb0; --star: #e0a100; --off: #c4ccd8;
    --display: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --fg: #e6ebf3; --muted: #93a0b4; --panel: #18202b; --line: #2a3544;
      --accent: #5b8bff; --accent-fg: #0b1220; --gem: #7df0ff; --star: #ffd45a; --off: #2e3a4b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --fg: #e6ebf3; --muted: #93a0b4; --panel: #18202b; --line: #2a3544;
    --accent: #5b8bff; --accent-fg: #0b1220; --gem: #7df0ff; --star: #ffd45a; --off: #2e3a4b;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--display);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
  h2 { margin: 0; font-size: 1.35rem; font-weight: 800; text-wrap: balance; }
  .gemchip { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gemchip i { width: 12px; height: 12px; background: var(--gem); transform: rotate(45deg); border-radius: 2px; display: block; }
  .screen { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .screen[hidden] { display: none !important; }
  .stage { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #101826; line-height: 0; }
  canvas { display: block; }
  #cv { width: 100%; height: auto; aspect-ratio: 800 / 450; touch-action: none; }
  .btn {
    font-family: var(--display); font-size: 0.95rem; font-weight: 600; padding: 10px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:focus-visible, .lvl:focus-visible, .pad button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .hero canvas, .shopTop canvas { width: 240px; max-width: 100%; height: auto; aspect-ratio: 240 / 170; border-radius: 10px; flex: none; }
  .heroText { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .heroText p, .hint2, .keys { margin: 0; color: var(--muted); line-height: 1.8; text-wrap: pretty; }
  .keys { font-size: 0.85rem; }
  .hint2 { font-size: 0.88rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
  .lvl {
    position: relative; font-family: var(--display); display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .lvl b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .lvl.boss { border-color: #e5484d; }
  .lvl em { position: absolute; top: -8px; font-style: normal; font-size: 0.7rem; background: #e5484d; color: #fff; padding: 0 8px; border-radius: 999px; }
  .lvl:disabled { opacity: 0.5; cursor: not-allowed; }
  .stars { font-size: 0.8rem; letter-spacing: 1px; white-space: nowrap; }
  .stars i, .big i { font-style: normal; color: var(--off); }
  .stars i.on, .big i.on { color: var(--star); }
  .big { font-size: 2rem; text-align: center; letter-spacing: 6px; }
  .shopTop { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .have { display: flex; flex-direction: column; gap: 4px; }
  .have span { color: var(--muted); font-size: 0.9rem; }
  .have b { font-size: 2rem; color: var(--gem); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .have small { color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card.wp { border-color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 0.88rem; }
  .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ch span { color: var(--muted); font-size: 0.82rem; }
  .pips { display: flex; gap: 4px; }
  .pips i { flex: 1; height: 6px; border-radius: 3px; background: var(--off); }
  .pips i.on { background: var(--accent); }
  .eff { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .buy { margin-top: auto; }
  .res { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  .stats { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; }
  .stats li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); }
  .pad { display: flex; justify-content: space-between; gap: 12px; direction: ltr; }
  .pad[hidden] { display: none !important; }
  .pad .g { display: flex; gap: 10px; }
  .pad button {
    font-family: var(--display); width: 68px; height: 62px; font-size: 1.4rem; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .pad button.act { width: 86px; font-size: 0.95rem; font-weight: 600; background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .pad button.on { filter: brightness(0.85); transform: scale(0.95); }
  .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .hint[hidden] { display: none !important; }
  #rot { display: none; position: fixed; inset: 0; z-index: 20; background: var(--bg); color: var(--fg); flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #rot .ph { width: 44px; height: 76px; border: 4px solid var(--fg); border-radius: 10px; animation: turn 2.4s ease-in-out infinite; }
  #rot p { margin: 0; font-weight: 600; font-size: 1.1rem; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (hover: none), (pointer: coarse) {
    body.playing { padding: 0; overflow: hidden; }
    body.playing .app { max-width: none; gap: 0; }
    body.playing header, body.playing .hint { display: none; }
    body.playing .stage { position: fixed; inset: 0; z-index: 1; border: 0; border-radius: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    body.playing .pad {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
      padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px));
      padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    }
    body.playing .pad button { pointer-events: auto; opacity: 0.55; width: 64px; height: 58px; backdrop-filter: blur(2px); }
    body.playing .pad button.act { width: 92px; }
    body.playing .pad button.on { opacity: 0.85; }
    body.playing .pad .g { gap: 12px; }
  }
  @media (orientation: portrait) and ((hover: none), (pointer: coarse)) { body.playing #rot { display: flex; } }
  @media (hover: hover) and (pointer: fine) { .pad { display: none !important; } }
  @media (hover: none), (pointer: coarse) { .hint { display: none !important; } }
  @media (prefers-reduced-motion: reduce) { .pad button.on { transform: none; } }
</style>

<div class="app" dir="rtl" lang="fa">
  <header>
    <h1>ربات پرنده</h1>
    <div class="gemchip"><i></i><span id="gemN">۰</span></div>
  </header>
  <section id="screen" class="screen"></section>
  <div id="stage" class="stage" hidden><canvas id="cv" aria-label="صفحه بازی"></canvas></div>
  <div id="pad" class="pad" hidden>
    <div class="g"><button type="button" id="bL" aria-label="چپ">◀</button><button type="button" id="bR" aria-label="راست">▶</button></div>
    <div class="g"><button type="button" id="bF" class="act">شلیک</button><button type="button" id="bJ" class="act">پرش / پرواز</button></div>
  </div>
  <p id="hint" class="hint" hidden>حرکت: ← → · پرش و پرواز (نگه دار): فاصله · شلیک: J · مکث: Esc</p>
</div>

<div id="rot" dir="rtl" lang="fa"><div class="ph"></div><p>گوشی رو بچرخون تا افقی بشه</p></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="enemies.js"></script>
<script src="draw.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>

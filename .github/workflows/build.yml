name: Build APK
run-name: job-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: {required: true}
      app_name: {required: true}
      package_id: {required: true}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - name: Build
        env:
          JOB: ${{ inputs.job_id }}
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_id }}
          PUBLIC_URL: .
        run: |
          set -e
          mkdir -p src && unzip -q jobs/$JOB/site.zip -d src
          find src -name __MACOSX -prune -exec rm -rf {} + || true
          shortest() { find src -name "$1" -not -path '*/node_modules/*' | awk '{print length($0) "\t" $0}' | sort -n | head -1 | cut -f2-; }
          G=$(shortest settings.gradle); [ -z "$G" ] && G=$(shortest settings.gradle.kts)
          if [ -n "$G" ]; then
            echo "== Native Android project =="
            cd "$(dirname "$G")"; chmod +x gradlew 2>/dev/null || true
            if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
            APK=$(find . -path '*outputs/apk*' -name '*debug*.apk' | head -1)
            cp "$APK" $GITHUB_WORKSPACE/app.apk
            exit 0
          fi
          PJ=$(shortest package.json)
          if [ -n "$PJ" ]; then
            echo "== JS project =="
            cd "$(dirname "$PJ")"
            npm install --no-audit --no-fund
            if grep -q '"build"' package.json; then
              if grep -q '"vite"' package.json; then npm run build -- --base=./; else npm run build; fi
            fi
            WEB=""
            for d in dist build out www public .; do [ -f "$d/index.html" ] && WEB="$PWD/$d" && break; done
            cd $GITHUB_WORKSPACE
          else
            IDX=$(shortest index.html); [ -z "$IDX" ] && { echo "index.html not found"; exit 1; }
            WEB="$PWD/$(dirname "$IDX")"
          fi
          [ -z "$WEB" ] && { echo "web build output not found"; exit 1; }
          W=$RUNNER_TEMP/wrap; M=$W/app/src/main; P=${PKG//./\/}
          mkdir -p $M/java/$P $M/res/values $M/assets
          cp -r "$WEB" $M/assets/www
          NAME=$(printf '%s' "$APP_NAME" | tr -d "'\"" | sed 's/&/\&amp;/g;s/</\&lt;/g')
          cat > $W/settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > $W/build.gradle
          echo "android.useAndroidX=false" > $W/gradle.properties
          cat > $W/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$PKG'
            compileSdk 34
            defaultConfig { applicationId '$PKG'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > $M/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name" android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo "<resources><string name=\"app_name\">$NAME</string></resources>" > $M/res/values/strings.xml
          cat > $M/java/$P/MainActivity.java <<EOF
          package $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.view.KeyEvent;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public boolean onKeyDown(int k, KeyEvent e) {
              if (k == KeyEvent.KEYCODE_BACK && w.canGoBack()) { w.goBack(); return true; }
              return super.onKeyDown(k, e);
            }
          }
          EOF
          cd $W && gradle assembleDebug --no-daemon
          cp $W/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/app.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ inputs.job_id }}" app.apk --title "${{ inputs.app_name }}" --notes "APK ready"

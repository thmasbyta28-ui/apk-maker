name: Build APK
run-name: job-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: {required: true}
      app_name: {required: true}
      package_id: {required: true}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - name: Build
        env:
          JOB: ${{ inputs.job_id }}
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_id }}
          PUBLIC_URL: .
        run: |
          set -e
          mkdir -p src && unzip -q jobs/$JOB/site.zip -d src
          find src -name __MACOSX -prune -exec rm -rf {} + || true
          shortest() { find src -name "$1" -not -path '*/node_modules/*' | awk '{print length($0) "\t" $0}' | sort -n | head -1 | cut -f2-; }
          G=$(shortest settings.gradle); [ -z "$G" ] && G=$(shortest settings.gradle.kts)
          if [ -n "$G" ]; then
            echo "== Native Android project =="
            cd "$(dirname "$G")"; chmod +x gradlew 2>/dev/null || true
            if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
            APK=$(find . -path '*outputs/apk*' -name '*debug*.apk' | head -1)
            cp "$APK" $GITHUB_WORKSPACE/app.apk
            exit 0
          fi
          PJ=$(shortest package.json)
          if [ -n "$PJ" ]; then
            echo "== JS project =="
            cd "$(dirname "$PJ")"
            npm install --no-audit --no-fund
            if grep -q '"build"' package.json; then
              if grep -q '"vite"' package.json; then npm run build -- --base=./; else npm run build; fi
            fi
            WEB=""
            for d in dist build out www public .; do [ -f "$d/index.html" ] && WEB="$PWD/$d" && break; done
            cd $GITHUB_WORKSPACE
          else
            IDX=$(shortest index.html); [ -z "$IDX" ] && { echo "index.html not found"; exit 1; }
            WEB="$PWD/$(dirname "$IDX")"
          fi
          [ -z "$WEB" ] && { echo "web build output not found"; exit 1; }
          W=$RUNNER_TEMP/wrap; M=$W/app/src/main; P=${PKG//./\/}
          mkdir -p $M/java/$P $M/res/values $M/assets
          cp -r "$WEB" $M/assets/www
          NAME=$(printf '%s' "$APP_NAME" | tr -d "'\"" | sed 's/&/\&amp;/g;s/</\&lt;/g')
          cat > $W/settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > $W/build.gradle
          echo "android.useAndroidX=false" > $W/gradle.properties
          cat > $W/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$PKG'
            compileSdk 34
            defaultConfig { applicationId '$PKG'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > $M/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <uses-feature android:name="android.hardware.microphone" android:required="false"/>
            <application android:label="@string/app_name" android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo "<resources><string name=\"app_name\">$NAME</string></resources>" > $M/res/values/strings.xml
          cat > $M/java/$P/MainActivity.java <<EOF
          package $PKG;
          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
            WebView w;
            ValueCallback<Uri[]> fcb;
            PermissionRequest pend;
            static final int FC = 1;
            static final int PERM = 2;

            static final String INJECT =
              "(function(){if(window.__dlp)return;window.__dlp=1;"
              + "document.addEventListener('click',function(e){"
              + "var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;"
              + "if(!a||String(a.href).indexOf('blob:')!==0)return;"
              + "e.preventDefault();e.stopPropagation();"
              + "var name=a.getAttribute('download')||'file';"
              + "fetch(a.href).then(function(r){return r.blob()}).then(function(b){"
              + "var CH=786432;"
              + "AndroidBridge.begin(name,b.type||'application/octet-stream');"
              + "var i=0;"
              + "(function next(){"
              + "if(i>=b.size){AndroidBridge.end();return}"
              + "var rd=new FileReader();"
              + "rd.onload=function(){AndroidBridge.chunk(String(rd.result).split(',')[1]);i+=CH;next()};"
              + "rd.onerror=function(){AndroidBridge.fail()};"
              + "rd.readAsDataURL(b.slice(i,i+CH));"
              + "})();"
              + "}).catch(function(){AndroidBridge.fail()});"
              + "},true);})();";

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.addJavascriptInterface(new Bridge(), "AndroidBridge");
              w.setWebViewClient(new WebViewClient() {
                @Override public void onPageFinished(WebView v, String url) {
                  v.evaluateJavascript(INJECT, null);
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fcb != null) fcb.onReceiveValue(null);
                  fcb = cb;
                  try {
                    startActivityForResult(p.createIntent(), FC);
                  } catch (Exception e) {
                    fcb = null;
                    cb.onReceiveValue(null);
                    toast("انتخاب فایل باز نشد");
                    return false;
                  }
                  return true;
                }
                @Override public void onPermissionRequest(final PermissionRequest req) {
                  runOnUiThread(new Runnable() {
                    public void run() {
                      ArrayList<String> need = new ArrayList<String>();
                      for (String r : req.getResources()) {
                        String p = null;
                        if (r.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) p = Manifest.permission.CAMERA;
                        if (r.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) p = Manifest.permission.RECORD_AUDIO;
                        if (p != null && Build.VERSION.SDK_INT >= 23 && checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) need.add(p);
                      }
                      if (need.isEmpty()) {
                        req.grant(req.getResources());
                      } else {
                        pend = req;
                        requestPermissions(need.toArray(new String[0]), PERM);
                      }
                    }
                  });
                }
              });
              w.loadUrl("file:///android_asset/www/index.html");
            }

            @Override protected void onActivityResult(int r, int c, Intent d) {
              if (r == FC) {
                if (fcb != null) {
                  fcb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d));
                  fcb = null;
                }
              } else {
                super.onActivityResult(r, c, d);
              }
            }

            @Override public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
              if (code == PERM && pend != null) {
                boolean ok = res.length > 0;
                for (int x : res) if (x != PackageManager.PERMISSION_GRANTED) ok = false;
                if (ok) pend.grant(pend.getResources()); else pend.deny();
                pend = null;
              } else {
                super.onRequestPermissionsResult(code, perms, res);
              }
            }

            void toast(final String m) {
              runOnUiThread(new Runnable() {
                public void run() { Toast.makeText(MainActivity.this, m, Toast.LENGTH_LONG).show(); }
              });
            }

            class Bridge {
              OutputStream os;
              String where = "";

              Uri insert(Uri col, String rel, String name, String mime) throws Exception {
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                return getContentResolver().insert(col, v);
              }

              @JavascriptInterface public synchronized void begin(String name, String mime) {
                try {
                  if (os != null) { try { os.close(); } catch (Exception e) {} os = null; }
                  name = name.replace("/", "_");
                  mime = mime.split(";")[0].trim();
                  if (Build.VERSION.SDK_INT >= 29) {
                    Uri col = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                    String rel = "Download/";
                    if (mime.startsWith("video/")) { col = MediaStore.Video.Media.EXTERNAL_CONTENT_URI; rel = "Movies/"; }
                    else if (mime.startsWith("image/")) { col = MediaStore.Images.Media.EXTERNAL_CONTENT_URI; rel = "Pictures/"; }
                    else if (mime.startsWith("audio/")) { col = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI; rel = "Music/"; }
                    Uri u = null;
                    try { u = insert(col, rel, name, mime); } catch (Exception e) { u = null; }
                    if (u == null) { u = insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, "Download/", name, mime); rel = "Download/"; }
                    os = getContentResolver().openOutputStream(u);
                    where = rel;
                  } else {
                    File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                    dir.mkdirs();
                    File f = new File(dir, name);
                    os = new FileOutputStream(f);
                    where = f.getAbsolutePath();
                  }
                  toast("در حال ذخیره...");
                } catch (Exception e) {
                  os = null;
                  toast("ذخیره نشد");
                }
              }

              @JavascriptInterface public synchronized void chunk(String b64) {
                try { if (os != null) os.write(Base64.decode(b64, Base64.DEFAULT)); }
                catch (Exception e) { os = null; toast("ذخیره نشد"); }
              }

              @JavascriptInterface public synchronized void end() {
                try {
                  if (os != null) { os.flush(); os.close(); toast("✅ ذخیره شد در: " + where); }
                } catch (Exception e) { toast("ذخیره نشد"); }
                os = null;
              }

              @JavascriptInterface public void fail() { toast("ذخیره نشد"); }
            }

            @Override public boolean onKeyDown(int k, KeyEvent e) {
              if (k == KeyEvent.KEYCODE_BACK && w.canGoBack()) { w.goBack(); return true; }
              return super.onKeyDown(k, e);
            }
          }
          EOF
          cd $W && gradle assembleDebug --no-daemon
          cp $W/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/app.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ inputs.job_id }}" app.apk --title "${{ inputs.app_name }}" --notes "APK ready"
